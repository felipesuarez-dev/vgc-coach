    priority: 3
    allowed_claim_types:
      - event_schedule
      - event_context
    required_for_minimum_stack: false
    freshness:
      max_age_days: 7
      policy: Re-check live before event dates, venue, or schedule claims.
    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - claim_type
      - freshness_note
    use_for:
      - official Regional, International, Special, and World Championship dates
      - event context for official play
    do_not_use_for:
      - usage or prevalence claims
      - decklists
      - legality or mechanics claims
    fallback_if_unavailable:
      - Use PokeData events or Limitless upcoming tournaments and label the replacement.
  - id: championship-series-results
