version: "3"
summary: "Use these shared live-source roles when researching the current Pokemon Champions meta or making current-field team recommendations. Official sources define legality, roster, calendar, and results; community sources describe the field inside that legal format; event sources verify standings; editorial sources add context."
usage: "Lock official regulation and roster truth first. Then use tournament_meta and broader_meta for the current field. Use supporting_sets only after the core stack is grounded. Use event_standings for results and team lists. Use editorial_context only for narrative, never for prevalence. A current-field recommendation needs the minimum meta stack; a team-building recommendation also needs the official roster."
minimum_stack:
  official: 1
  tournament_meta: 1
  broader_meta: 1
team_build_stack:
  official_roster: 1
sources:
  - id: regulation-set-m-c
    display_name: Regulation Set M-C
    role: official_regulation
    source_kind: official
    canonical_url: https://news.pokemon-home.com/en/page/816.html
    priority: 1
    regulation_id: regulation-m-c
    temporal_status: current
    active_window:
      start: "2026-09-09T02:00:00Z"
      end: "2026-12-02T01:59:00Z"
    allowed_claim_types:
      - legality
      - mechanics
      - format_dates
      - held_item_rules
      - timers
    required_for_minimum_stack: true
    freshness:
      max_age_days: 30
      policy: Re-check live before present-tense rules, legality, mechanics, or item claims.
    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - format_window
      - active_mechanics
      - claim_type
    use_for:
      - active regulation dates
      - active mechanics
      - held item rules
      - timers
    do_not_use_for:
      - tournament usage claims
      - prevalence claims about specific teams or cores
      - set tendency claims
    fallback_if_unavailable:
      - Use the latest official Pokemon HOME Champions regulation article and label the swap explicitly.
      - If no current official rules source is available, do not make present-tense legality or mechanics claims.
  - id: official-roster-m-c
    display_name: Regulation M-C Eligible Roster
    role: official_roster
    source_kind: official
    canonical_url: https://web-view.app.pokemonchampions.jp/battle/pages/events/rs178713870219xeaaio/en/pokemon.html
    priority: 2
    regulation_id: regulation-m-c
    temporal_status: current
    active_window:
      start: "2026-09-09T02:00:00Z"
      end: "2026-12-02T01:59:00Z"
    allowed_claim_types:
      - roster_legality
    required_for_minimum_stack: true
    freshness:
      max_age_days: 7
      policy: Re-check live before presenting a species as eligible; the roster is regulation-specific.
    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - claim_type
      - format_window
    use_for:
      - verifying the requested species and the five supporting species are in the official eligible roster
      - legality ledger species rows
    do_not_use_for:
      - item legality
      - move legality
      - ability legality
      - mechanics
      - usage claims
    fallback_if_unavailable:
      - Use the eligible-Pokemon link on the current official regulation article and label the swap.
      - If no official roster is available, mark species legality unverified and do not call the build export-ready.
  - id: championship-series-calendar
    display_name: Championship Series Calendar
    role: official_calendar
    source_kind: official
