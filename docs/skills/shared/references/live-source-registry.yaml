      - source_id
      - source_url
      - fetched_at
      - format_window
      - active_mechanics
      - claim_type
    use_for:
      - scheduled successor regulation dates
      - announced additions that the official page states explicitly
      - transition preparation while the previous regulation is still current
    do_not_use_for:
      - present-tense legality while the previous regulation is current
      - unannounced items, moves, abilities, or mechanics
      - usage or prevalence claims
    fallback_if_unavailable:
      - Keep the current regulation active until the official start timestamp.
      - If the announcement is incomplete, do not infer the missing roster, items, moves, or mechanics.
