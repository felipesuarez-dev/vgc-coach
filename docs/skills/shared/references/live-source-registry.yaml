    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - claim_type
      - sample_scope
      - freshness_note
    use_for:
      - monthly Champions chaos stats
      - usage, win rates, moves, items, abilities, and teammates
      - automated broader-meta fallback when PokeStats is blocked
    do_not_use_for:
      - legality or mechanics claims
      - official event timing claims
      - present-tense claims when the current month has not been published
    fallback_if_unavailable:
      - Use PokeStats through a browser or webfetch and label the replacement.
