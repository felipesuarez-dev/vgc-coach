  - id: infovgc
    display_name: infovgc
    role: tournament_meta
    source_kind: community
    canonical_url: https://infovgc.com/meta
    priority: 5
    allowed_claim_types:
      - tournament_usage
      - top_teams
      - current_snapshot
      - win_rate
      - core_pairs
    required_for_minimum_stack: true
    freshness:
      max_age_days: 1
      policy: Re-check live before tournament usage, win-rate, Top 8, or core claims; the site updates several times a day.
    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - claim_type
      - sample_scope
      - freshness_note
    use_for:
      - tournament usage leaders with adjusted win rate and Top 8 index
      - recent teams, trends, cores, and matchup pages for the active regulation
      - official online tournament samples with team and game counts
    do_not_use_for:
      - legality or mechanics claims
      - exact move or item legality claims
    fallback_if_unavailable:
      - Use Limitless or LabMaus and say which source replaced it.
      - If no tournament-focused source is available, downgrade current-field conclusions to early-read language.
  - id: labmaus
    display_name: LabMaus
