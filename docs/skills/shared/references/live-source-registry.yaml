  - id: regulation-set-m-d
    display_name: Regulation Set M-D
    role: official_regulation
    source_kind: official
    canonical_url: https://news.pokemon-home.com/en/page/878.html
    priority: 16
    regulation_id: regulation-m-d
    temporal_status: upcoming
    active_window:
      start: "2026-12-02T02:00:00Z"
      end: "2027-03-03T01:59:00Z"
    allowed_claim_types:
      - legality
      - mechanics
      - format_dates
      - held_item_rules
      - timers
    required_for_minimum_stack: false
    freshness:
      max_age_days: 30
      policy: Re-check live before present-tense rules, legality, mechanics, or item claims; the announcement says full details are still pending.
