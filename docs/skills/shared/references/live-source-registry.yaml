    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - claim_type
      - sample_scope
      - freshness_note
    use_for:
      - Showdown ladder usage for the current Champions regulation
      - Bo3 ladder usage and battle samples
    do_not_use_for:
      - legality or mechanics claims
      - official event timing claims
      - exact move or item legality claims
    fallback_if_unavailable:
      - Use Smogon stats for automated CLI checks and label the replacement.
      - PokeStats may be browser or webfetch only; do not claim a CLI check succeeded when it returned HTTP 403.
  - id: smogon
